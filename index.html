<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>yay.app</title>

  <!-- PAGE ICON -->
  <link rel="icon" type="image/png" href="https://github.com/DroolyDragon/yayapp/blob/main/yay.appicon.png?raw=true">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #000;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 50px 20px;
      text-align: center;
    }

    .logo {
      width: 260px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 18px;
      margin-bottom: 40px;
      opacity: 0.8;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #ddd;
      transition: transform 0.1s ease;
    }

    .card:hover {
      transform: scale(1.03);
    }

    .card img {
      width: 100%;
      display: block;
    }

    .card-title {
      padding: 10px;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div class="container">

    <img
      class="logo"
      src="https://github.com/DroolyDragon/yayapp/blob/main/yay.applogo.png?raw=true"
      alt="logo"
    />

    <div class="subtitle">
      hey it me dooly welcmoe to my cool fun site
    </div>

    <div class="grid">
      <a class="card" href="https://neal.fun/cursor-camp/">
        <img src="./cursor-camp.svg" alt="Gubble" />
        <div class="card-title">Gubble</div>
      </a>
    </div>

  </div>
</body>
</html>
